name: contract

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.gate.outputs.deployable }}
    env:
      PROVIDER_VERSION: ${{ github.sha }}
      CONSUMER_VERSION: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate pact (consumer)
        run: npm run test:contract

      - name: Start Pact Broker
        run: docker compose up -d --wait broker-db pact-broker

      - name: Publish pact to broker
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
        run: |
          BROKER_URL="${PACT_BROKER_URL:-http://127.0.0.1:21120}"
          curl -sf -X PUT \
            "${BROKER_URL}/pacts/provider/marketplace-api/consumer/marketplace-web/version/${CONSUMER_VERSION}" \
            -H 'Content-Type: application/json' \
            -d @pacts/marketplace-web-marketplace-api.json

      - name: Verify provider and publish result
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          PROVIDER_VERSION: ${{ env.PROVIDER_VERSION }}
        run: |
          export PACT_BROKER_URL="${PACT_BROKER_URL:-http://127.0.0.1:21120}"
          npm run verify:provider

      - name: can-i-deploy
        id: gate
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
        run: |
          BROKER_URL="${PACT_BROKER_URL:-http://127.0.0.1:21120}"
          body="$(curl -sf "${BROKER_URL}/can-i-deploy?pacticipant=marketplace-web&version=${CONSUMER_VERSION}&to=prod")"
          echo "$body"
          node -e '
            const fs = require("fs");
            const s = JSON.parse(process.argv[1]).summary || {};
            const write = (v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, "deployable=" + v + "\n");
            if (s.deployable === true) { write("true"); process.exit(0); }
            if (s.deployable === false || (s.failed || 0) > 0) {
              console.error(s);
              write("false");
              process.exit(1);
            }
            console.log("can-i-deploy: no provider version is tagged prod yet; gate ran before any tag");
            write("unknown");
          ' "$body"

  # Tag only after the gate said yes. A fresh broker answers unknown and this job is skipped.
  deploy:
    needs: contract
    if: needs.contract.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    env:
      PROVIDER_VERSION: ${{ github.sha }}
    steps:
      - name: Tag provider version as prod
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
        run: |
          if [ -z "${PACT_BROKER_URL}" ]; then
            echo "Refusing to tag prod without PACT_BROKER_URL."
            exit 1
          fi
          curl -sf -X PUT \
            "${PACT_BROKER_URL}/pacticipants/marketplace-api/versions/${PROVIDER_VERSION}/tags/prod" \
            -H 'Content-Type: application/json'
