;; PgBouncer in front of marketplace Postgres (service `db`).
;; pool_mode = transaction: backend connection is held only for a transaction.

[databases]
shop = host=db port=5432 dbname=shop

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
default_pool_size = 5
max_client_conn = 200

;; Track named prepared statements (needed for TypeORM/node-pg in transaction mode).
max_prepared_statements = 200

;; Admin DB: psql -p 21111 -U app_user_a -d pgbouncer → SHOW POOLS
admin_users = app_user_a
stats_users = app_user_a

ignore_startup_parameters = extra_float_digits
