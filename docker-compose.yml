name: marketplace
services:
  db:
    image: postgres:16-alpine
    ports:
      - "21110:5432"
    environment:
      # Admin for ALTER ROLE / rotate.sh — the app never uses this user.
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only
      POSTGRES_DB: shop
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d shop"]
      interval: 2s
      timeout: 2s
      retries: 15
