name: marketplace
services:
  db:
    image: postgres:16-alpine
    ports:
      - "21110:5432"
    environment:
      # Admin for ALTER ROLE / rotate.sh — the app never uses this user.
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only
      POSTGRES_DB: shop
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d shop"]
      interval: 2s
      timeout: 2s
      retries: 15

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    ports:
      - "21111:5432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=app-v1-password psql -h 127.0.0.1 -p 5432 -U app_user_a -d shop -c 'SELECT 1' >/dev/null",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
