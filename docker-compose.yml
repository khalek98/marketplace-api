name: marketplace
services:
  db:
    image: postgres:16-alpine
    ports:
      - "21110:5432"
    environment:
      # Admin for ALTER ROLE / rotate.sh — the app never uses this user.
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only
      POSTGRES_DB: shop
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d shop"]
      interval: 2s
      timeout: 2s
      retries: 15

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    ports:
      - "21111:5432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=app-v1-password psql -h 127.0.0.1 -p 5432 -U app_user_a -d shop -c 'SELECT 1' >/dev/null",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  # Clean Postgres for restore-drill only (`docker compose --profile drill …`).
  restore:
    image: postgres:16-alpine
    profiles: ["drill"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only
      POSTGRES_DB: shop
    volumes:
      - pgdata-restore:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d shop"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Pact Broker DB — internal only (not published on the host).
  broker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_DB: broker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d broker"]
      interval: 2s
      timeout: 2s
      retries: 15

  # AMQP on 21130, management UI on 21131. Diagnostics, not an open port:
  # the Erlang node can reset the first publish until check_running passes.
  rabbit:
    image: rabbitmq:4.3.4-management-alpine
    hostname: rabbit
    ports:
      - "21130:5672"
      - "21131:15672"
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    healthcheck:
      # Image user is root; the server drops to rabbitmq. A root diagnostics
      # process writes .erlang.cookie, and the node then fails with eacces.
      test:
        [
          "CMD-SHELL",
          "su-exec rabbitmq rabbitmq-diagnostics -q check_running && su-exec rabbitmq rabbitmq-diagnostics -q check_port_connectivity",
        ]
      interval: 5s
      start_interval: 1s
      start_period: 40s
      timeout: 10s
      retries: 10

  # Contract catalog for can-i-deploy. Host port 21120 (not 21110/21111/21150).
  pact-broker:
    image: pactfoundation/pact-broker:2.142.0-pactbroker2.120.0
    ports:
      - "21120:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://broker:broker@broker-db/broker
      PACT_BROKER_ALLOW_PUBLIC_READ: "true"
    depends_on:
      broker-db:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: inside the image localhost may be ::1; puma is IPv4-only.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pgdata-restore:
