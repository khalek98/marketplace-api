# Local one-node cluster for HW-28 demos.
# Host port 21190 stays in this repo's 211xx band (lecture uses 22880).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: marketplace
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30190
        hostPort: 21190
        protocol: TCP
