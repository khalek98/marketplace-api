name: marketplace-infisical

services:
  db:
    image: postgres:14-alpine
    container_name: marketplace-infisical-db
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: infisical-local-only
      POSTGRES_DB: infisical
    volumes:
      - marketplace-infisical-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: marketplace-infisical-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  app:
    image: infisical/infisical:v0.162.19
    container_name: marketplace-infisical-app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "21150:8080"
    environment:
      ENCRYPTION_KEY: 6c1fe4e407b8911c104518103505b218 # 32 hex = 16 байт
      AUTH_SECRET: bXktbGVjdHVyZS1hdXRoLXNlY3JldC1sMTE= # base64, 32 байти
      DB_CONNECTION_URI: postgres://infisical:infisical-local-only@db:5432/infisical
      REDIS_URL: redis://redis:6379
      SITE_URL: http://localhost:21150
      TELEMETRY_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/status >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 20s

volumes:
  marketplace-infisical-pgdata:
